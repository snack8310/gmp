# Turns prose rules into gates, per the constraint-hardening order in
# AGENTS.md: shell portability (docs/history/memory/), the docs consistency
# checks that four rounds of manual review failed to hold, and the gmp-core
# checks -- among them the dependency direction that a single import line would
# otherwise breach without anything failing.
name: gates

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used and nothing is written back to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dash, zsh and ksh are the interpreters that expose the portability
      # traps this suite exists to catch; sh and bash are already present.
      - name: Install shells
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dash zsh ksh shellcheck

      - name: Report interpreter versions
        run: |
          for s in sh bash dash zsh ksh; do
            printf '%-6s %s\n' "$s" "$(command -v "$s" || echo MISSING)"
          done
          shellcheck --version

      - name: shellcheck
        run: shellcheck -s sh .githooks/* test/githooks/*.sh

      - name: pre-push hook regression tests
        run: sh test/githooks/pre-push_test.sh

      # Four evaluator rounds missed the same classes of defect by hand:
      # retracted facts cited as grounds, numbering that skipped, documents
      # classified by label rather than content, and change records describing
      # products that do not exist.
      - name: docs consistency
        run: python3 test/docs/consistency_check.py

      # The version comes from gmp-core/go.mod rather than being pinned here,
      # so the toolchain the gate runs cannot drift from the one the module
      # declares.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gmp-core/go.mod
          # gmp-core has no external dependencies, so there is no go.sum for
          # the cache to key on. Leaving the cache enabled would fail the step
          # looking for a lock file that correctly does not exist.
          cache: false

      - name: Report Go version
        working-directory: gmp-core
        run: go version

      - name: gofmt
        working-directory: gmp-core
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        working-directory: gmp-core
        run: go build ./...

      - name: go vet
        working-directory: gmp-core
        run: go vet ./...

      # Covers the domain assertions for experimentation and the
      # dependency-direction check in internal/arch, including the mutations
      # that prove that check is not vacuous.
      - name: go test
        working-directory: gmp-core
        run: go test ./...
